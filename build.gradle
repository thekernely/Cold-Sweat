plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

repositories {
}

loom {
    mods {
        "cold_sweat" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            // Incremental Fabric port.
            include 'com/momosoftworks/coldsweat/fabric/**'
            include 'com/momosoftworks/coldsweat/core/init/ModSounds.java'
            include 'com/momosoftworks/coldsweat/core/init/ModParticleTypes.java'
            include 'com/momosoftworks/coldsweat/core/init/ModAttributes.java'
            include 'com/momosoftworks/coldsweat/core/init/ModEffects.java'
            include 'com/momosoftworks/coldsweat/core/init/ModPotions.java'
            include 'com/momosoftworks/coldsweat/core/init/ModArmorMaterials.java'
            include 'com/momosoftworks/coldsweat/core/init/ModItemComponents.java'
            include 'com/momosoftworks/coldsweat/core/init/ModItems.java'
            include 'com/momosoftworks/coldsweat/core/init/ModAdvancementTriggers.java'
            include 'com/momosoftworks/coldsweat/core/init/ModCreativeTabs.java'
            include 'com/momosoftworks/coldsweat/core/init/ModDataAttachments.java'
            include 'com/momosoftworks/coldsweat/core/advancement/trigger/ArmorInsulatedTrigger.java'
            include 'com/momosoftworks/coldsweat/core/advancement/trigger/SoulLampFueledTrigger.java'
            include 'com/momosoftworks/coldsweat/common/effect/**'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureData.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureRuntime.java'
            include 'com/momosoftworks/coldsweat/common/capability/handler/EntityTempManager.java'
            include 'com/momosoftworks/coldsweat/util/registries/ModGameRules.java'

            include 'com/momosoftworks/coldsweat/data/tag/ModBiomeTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModBlockTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModEffectTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModEntityTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModFluidTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModItemTags.java'

            // M3: core temperature model, persistence, sync, manager and mutation semantics.
            include 'com/momosoftworks/coldsweat/api/util/Temperature.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/TempModifier.java'
            include 'com/momosoftworks/coldsweat/api/registry/TempModifierRegistry.java'
            include 'com/momosoftworks/coldsweat/api/registry/BlockTempRegistry.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/BlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/FurnaceBlockTemp.java'
            include 'com/momosoftworks/coldsweat/core/init/BlockTempInit.java'
            include 'com/momosoftworks/coldsweat/core/init/TempModifierInit.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/BiomeTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/ElevationTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/ShadeTempModifier.java'
            include 'com/momosoftworks/coldsweat/util/world/WorldTemperatureUtil.java'
            include 'com/momosoftworks/coldsweat/config/WorldTemperatureSettings.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureModifierRuntime.java'
            include 'com/momosoftworks/coldsweat/api/event/common/temperautre/TemperatureChangedEvent.java'
        }

        resources {
            include 'fabric.mod.json'
            include 'assets/cold_sweat/sounds.json'
            include 'assets/cold_sweat/sounds/**'
            include 'assets/cold_sweat/particles/**'
            include 'assets/cold_sweat/textures/particle/**'
            include 'assets/cold_sweat/textures/mob_effect/**'
            include 'assets/cold_sweat/lang/**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}
