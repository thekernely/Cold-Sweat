plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

repositories {
}

loom {
    mods {
        "cold_sweat" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            // Incremental Fabric port.
            include 'com/momosoftworks/coldsweat/fabric/**'
            include 'com/momosoftworks/coldsweat/core/init/ModSounds.java'
            include 'com/momosoftworks/coldsweat/core/init/ModParticleTypes.java'
            include 'com/momosoftworks/coldsweat/core/init/ModAttributes.java'
            include 'com/momosoftworks/coldsweat/core/init/ModEffects.java'
            include 'com/momosoftworks/coldsweat/core/init/ModPotions.java'
            include 'com/momosoftworks/coldsweat/core/init/ModArmorMaterials.java'
            include 'com/momosoftworks/coldsweat/core/init/ModItemComponents.java'
            include 'com/momosoftworks/coldsweat/core/init/ModItems.java'
            include 'com/momosoftworks/coldsweat/core/init/ModFluids.java'
            include 'com/momosoftworks/coldsweat/common/fluid/SlushFluid.java'
            include 'com/momosoftworks/coldsweat/common/block/SlushLiquidBlock.java'
            include 'com/momosoftworks/coldsweat/core/init/ModAdvancementTriggers.java'
            include 'com/momosoftworks/coldsweat/core/init/ModCreativeTabs.java'
            include 'com/momosoftworks/coldsweat/core/init/ModDataAttachments.java'
            include 'com/momosoftworks/coldsweat/core/advancement/trigger/ArmorInsulatedTrigger.java'
            include 'com/momosoftworks/coldsweat/core/advancement/trigger/SoulLampFueledTrigger.java'
            include 'com/momosoftworks/coldsweat/common/effect/**'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureData.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureRuntime.java'
            include 'com/momosoftworks/coldsweat/common/capability/handler/EntityTempManager.java'

            // M8.1: persistent synchronized player hydration state foundation.
            include 'com/momosoftworks/coldsweat/common/capability/hydration/HydrationData.java'
            include 'com/momosoftworks/coldsweat/common/capability/handler/PlayerHydrationManager.java'
            include 'com/momosoftworks/coldsweat/api/util/Hydration.java'
            include 'com/momosoftworks/coldsweat/util/registries/ModGameRules.java'
            include 'com/momosoftworks/coldsweat/util/registries/ModDamageSources.java'

            include 'com/momosoftworks/coldsweat/data/tag/ModBiomeTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModBlockTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModEffectTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModEntityTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModFluidTags.java'
            include 'com/momosoftworks/coldsweat/data/tag/ModItemTags.java'

            // M3: core temperature model, persistence, sync, manager and mutation semantics.
            include 'com/momosoftworks/coldsweat/api/util/Temperature.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/TempModifier.java'
            include 'com/momosoftworks/coldsweat/api/registry/TempModifierRegistry.java'
            include 'com/momosoftworks/coldsweat/api/registry/BlockTempRegistry.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/BlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/FurnaceBlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/NetherPortalBlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/SimpleBlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/StaticBlockTemp.java'
            include 'com/momosoftworks/coldsweat/api/temperature/block_temp/ThermalMachineBlockTemp.java'
            include 'com/momosoftworks/coldsweat/core/init/MachineBlockTempInit.java'
            include 'com/momosoftworks/coldsweat/core/init/BlockTempInit.java'
            include 'com/momosoftworks/coldsweat/core/init/TempModifierInit.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/BiomeTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/ElevationTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/EntitiesTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/CaveBiomeTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/BlockTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/ShadeTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/WaterTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/FreezingTempModifier.java'
            include 'com/momosoftworks/coldsweat/config/WaterExposureSettings.java'
            include 'com/momosoftworks/coldsweat/config/TemperatureDamageSettings.java'
            include 'com/momosoftworks/coldsweat/config/TemperatureEffectSettings.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureEffectRuntime.java'
            include 'com/momosoftworks/coldsweat/mixin/LivingEntityMixin.java'
            include 'com/momosoftworks/coldsweat/mixin/FoodDataMixin.java'
            include 'com/momosoftworks/coldsweat/mixin/CropGrowthMixin.java'
            include 'com/momosoftworks/coldsweat/mixin/TransmuteRecipeDisplayMixin.java'
            include 'com/momosoftworks/coldsweat/mixin/client/FrozenHeartHudMixin.java'
            include 'com/momosoftworks/coldsweat/util/world/WorldTemperatureUtil.java'
            include 'com/momosoftworks/coldsweat/config/WorldTemperatureSettings.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureModifierRuntime.java'
            include 'com/momosoftworks/coldsweat/common/capability/temperature/TemperatureDamageRuntime.java'
            include 'com/momosoftworks/coldsweat/api/event/common/temperautre/TemperatureChangedEvent.java'

            // M5.1: insulation value model and adaptive armor state foundation.
            include 'com/momosoftworks/coldsweat/api/insulation/Insulation.java'
            include 'com/momosoftworks/coldsweat/api/insulation/StaticInsulation.java'
            include 'com/momosoftworks/coldsweat/api/insulation/AdaptiveInsulation.java'

            // M5.2: armor-insulation rate transform and Fabric-side strength default.
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/ArmorInsulationTempModifier.java'
            include 'com/momosoftworks/coldsweat/config/InsulationSettings.java'

            // M5.3: built-in armor insulation registry and live RATE application.
            include 'com/momosoftworks/coldsweat/api/registry/InsulationRegistry.java'
            include 'com/momosoftworks/coldsweat/common/capability/insulation/ArmorInsulationRuntime.java'

            // M5.5: persistent sewn insulation state and component manager.
            include 'com/momosoftworks/coldsweat/common/capability/insulation/ItemInsulationCap.java'
            include 'com/momosoftworks/coldsweat/common/capability/handler/ItemInsulationManager.java'

            // M5.6: consumable temperature runtime and Soul Sprout gameplay.
            include 'com/momosoftworks/coldsweat/api/registry/ItemTemperatureRegistry.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/FoodTempModifier.java'
            include 'com/momosoftworks/coldsweat/api/temperature/modifier/SoulSproutTempModifier.java'
            include 'com/momosoftworks/coldsweat/common/item/SoulSproutItem.java'

            // M5.7: waterskin item runtime and thermometer.

            include 'com/momosoftworks/coldsweat/common/item/WaterskinItem.java'
            include 'com/momosoftworks/coldsweat/common/item/FilledWaterskinItem.java'
            include 'com/momosoftworks/coldsweat/common/item/ThermometerItem.java'

            // M6.2: built-in thermal-machine fuels and waterskin processing runtime.
            include 'com/momosoftworks/coldsweat/api/registry/ThermalFuelRegistry.java'

            // M6.1: thermal-machine blocks, typed block entities, and persistent fuel state.
            include 'com/momosoftworks/coldsweat/core/init/ModBlocks.java'
            include 'com/momosoftworks/coldsweat/core/init/ModBlockEntities.java'
            include 'com/momosoftworks/coldsweat/core/init/ModMenus.java'
            include 'com/momosoftworks/coldsweat/common/container/HearthMenu.java'
            include 'com/momosoftworks/coldsweat/common/container/BoilerMenu.java'
            include 'com/momosoftworks/coldsweat/common/container/IceboxMenu.java'
            include 'com/momosoftworks/coldsweat/common/block/HearthBottomBlock.java'
            include 'com/momosoftworks/coldsweat/common/block/HearthTopBlock.java'
            include 'com/momosoftworks/coldsweat/common/block/BoilerBlock.java'
            include 'com/momosoftworks/coldsweat/common/block/IceboxBlock.java'
            include 'com/momosoftworks/coldsweat/common/block/SmokestackBlock.java'
            include 'com/momosoftworks/coldsweat/client/renderer/block/HearthBlockEntityRenderer.java'
            include 'com/momosoftworks/coldsweat/common/blockentity/HearthBlockEntity.java'
            include 'com/momosoftworks/coldsweat/common/blockentity/BoilerBlockEntity.java'
            include 'com/momosoftworks/coldsweat/common/blockentity/IceboxBlockEntity.java'
            include 'com/momosoftworks/coldsweat/common/blockentity/ThermalFluidStorage.java'
        }

        resources {
            include 'fabric.mod.json'
            include 'cold_sweat.mixins.json'
            include 'assets/cold_sweat/sounds.json'
            include 'assets/cold_sweat/sounds/**'
            include 'assets/cold_sweat/particles/**'
            include 'assets/cold_sweat/textures/particle/**'
            include 'assets/cold_sweat/textures/mob_effect/**'
            include 'assets/cold_sweat/lang/**'

            // M8.10a: close the resource gap for legacy registered items.
            include 'assets/cold_sweat/items/**'
            include 'assets/cold_sweat/models/item/**'
            include 'assets/cold_sweat/textures/item/**'
            include 'data/c/tags/worldgen/biome/**'
            include 'data/cold_sweat/damage_type/**'
            include 'data/minecraft/tags/damage_type/no_knockback.json'
            include 'data/minecraft/tags/damage_type/no_impact.json'
            include 'data/minecraft/tags/damage_type/bypasses_cooldown.json'

            // M6.7: thermal-machine blockstates, models, and textures.
            include 'assets/cold_sweat/blockstates/hearth_bottom.json'
            include 'assets/cold_sweat/blockstates/hearth_top.json'
            include 'assets/cold_sweat/blockstates/boiler.json'
            include 'assets/cold_sweat/blockstates/icebox.json'
            include 'assets/cold_sweat/blockstates/smokestack.json'
            include 'assets/cold_sweat/models/block/hearth_bottom.json'
            include 'assets/cold_sweat/models/block/hearth_top.json'
            include 'assets/cold_sweat/models/block/generic_smokestack.json'
            include 'assets/cold_sweat/models/block/smokestack.json'
            include 'assets/cold_sweat/models/block/boiler.json'
            include 'assets/cold_sweat/models/block/boiler_lit.json'
            include 'assets/cold_sweat/models/block/icebox.json'
            include 'assets/cold_sweat/models/block/icebox_frosted.json'
            include 'assets/cold_sweat/models/block/icebox_smokestack.json'
            include 'assets/cold_sweat/models/block/icebox_frosted_smokestack.json'
            include 'assets/cold_sweat/textures/block/boiler*.png'
            include 'assets/cold_sweat/textures/block/hearth*.png'
            include 'assets/cold_sweat/textures/block/icebox*.png'
            include 'assets/cold_sweat/textures/block/smokestack*.png'

            // M6.10: Slush fluid presentation and thermal-machine release resources.
            include 'assets/cold_sweat/models/item/slush_bucket.json'
            include 'assets/cold_sweat/items/slush_bucket.json'
            include 'assets/cold_sweat/textures/item/bucket_slush.png'
            include 'assets/cold_sweat/textures/gui/overlay/body_temp_gauge.png'
            include 'assets/cold_sweat/textures/gui/overlay/vague_temp_gauge.png'
            include 'assets/cold_sweat/textures/gui/overlay/hearts_frozen.png'
            include 'assets/cold_sweat/textures/gui/sprites/hearth/**'
            include 'assets/cold_sweat/textures/gui/screen/icebox_gui.png'
            include 'assets/cold_sweat/textures/gui/screen/boiler_gui.png'
            include 'assets/cold_sweat/textures/gui/screen/hearth_gui.png'
            include 'data/cold_sweat/recipe/hearth.json'
            include 'data/cold_sweat/recipe/boiler.json'
            include 'data/cold_sweat/recipe/icebox.json'
            include 'data/cold_sweat/recipe/smokestack.json'
            include 'data/cold_sweat/loot_table/blocks/hearth_bottom.json'
            include 'data/cold_sweat/loot_table/blocks/hearth_top.json'
            include 'data/cold_sweat/loot_table/blocks/boiler.json'
            include 'data/cold_sweat/loot_table/blocks/icebox.json'
            include 'data/cold_sweat/loot_table/blocks/smokestack.json'

            // M9.3c: preserve the tool tags used by all restored thermal-machine blocks.
            // Without these resources, requiresCorrectToolForDrops() sees no valid
            // pickaxe for Hearth/Boiler/Smokestack and axe mining never accelerates
            // the Icebox.
            include 'data/minecraft/tags/block/mineable/pickaxe.json'
            include 'data/minecraft/tags/block/mineable/axe.json'

            // M5.8: first-useful-release item recipes.
            include 'data/cold_sweat/recipe/waterskin.json'
            include 'data/cold_sweat/recipe/thermometer.json'

            // M8.4: vanilla raw-water bottle + purified bottle resources.
            include 'assets/cold_sweat/items/purified_water_bottle.json'
            include 'data/cold_sweat/recipe/purified_water_bottle_*.json'

            // M8.5/M8.6: reusable flask family, filters, and upgrades.
            include 'assets/cold_sweat/items/*_flask.json'
            include 'assets/cold_sweat/models/item/*_flask.json'
            include 'assets/cold_sweat/textures/item/*_flask.png'
            include 'assets/cold_sweat/items/water_filter.json'
            include 'assets/cold_sweat/models/item/water_filter.json'
            include 'assets/cold_sweat/textures/item/water_filter.png'
            include 'data/cold_sweat/recipe/leather_flask.json'
            include 'data/cold_sweat/recipe/water_filter.json'
            include 'data/cold_sweat/recipe/install_filter_*_flask.json'
            include 'data/cold_sweat/recipe/*_flask_upgrade.json'
            include 'data/cold_sweat/recipe/netherite_flask_smithing.json'

            // M8.7: explicit data-driven food hydration values.
            include 'data/cold_sweat/food_hydration/**'

            // M10.2a: explicitly package the opt-in frost crop tag.
            include 'data/cold_sweat/tags/block/crops/frost_affected.json'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

