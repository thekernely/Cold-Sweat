plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

repositories {
}

loom {
    mods {
        "cold_sweat" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java {
            // Incremental Fabric port.
            include 'com/momosoftworks/coldsweat/fabric/**'
            include 'com/momosoftworks/coldsweat/core/init/ModSounds.java'
            include 'com/momosoftworks/coldsweat/core/init/ModParticleTypes.java'
            include 'com/momosoftworks/coldsweat/core/init/ModAttributes.java'
            include 'com/momosoftworks/coldsweat/util/registries/ModGameRules.java'
        }

        resources {
            // Keep old NeoForge metadata/mixins out of the bootstrap runtime,
            // while progressively restoring resources used by ported systems.
            include 'fabric.mod.json'
            include 'assets/cold_sweat/sounds.json'
            include 'assets/cold_sweat/sounds/**'
            include 'assets/cold_sweat/particles/**'
            include 'assets/cold_sweat/textures/particle/**'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version

    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}
